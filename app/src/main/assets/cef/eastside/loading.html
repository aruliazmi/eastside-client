<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Eastside Stories - Loading</title>
    <!-- Genesis Design System Fonts: General Sans (Display) + DM Sans (Body) + JetBrains Mono (Code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
    <style>
html, body, #app {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
/* Genesis Design System Tokens */

:root {
  /* Colors */
  --genesis-primary: #6366F1;
  --genesis-primary-hover: #4F46E5;
  --genesis-secondary: #20970B;
  --genesis-neutral: #9C9C9C;
  --genesis-bg-light: #FAFAFA;
  --genesis-surface-light: #FFFFFF;
  --genesis-text-primary-light: #0A0A0A;
  --genesis-text-secondary-light: #6B6B6B;
  
  /* In-Game Dark Surface Variants (Transparent Overlay) */
  --genesis-bg-dark: rgba(10, 12, 20, 0.85);
  --genesis-surface-dark: rgba(18, 22, 36, 0.94);
  --genesis-surface-card: rgba(26, 32, 52, 0.85);
  --genesis-text-primary: #F8FAFC;
  --genesis-text-secondary: #94A3B8;
  --genesis-text-muted: #64748B;
  --genesis-border: rgba(232, 232, 236, 0.14);
  --genesis-border-focus: #6366F1;

  /* Semantic State Colors */
  --genesis-success: #10B981;
  --genesis-success-hover: #059669;
  --genesis-warning: #F59E0B;
  --genesis-error: #EF4444;
  --genesis-error-hover: #DC2626;

  /* Typography */
  --font-display: 'General Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-code: 'JetBrains Mono', monospace;

  /* Border Radius */
  --radius-xs: 4px;   /* Tags, chips, badges, inline code */
  --radius-sm: 6px;   /* Buttons, inputs, selects */
  --radius-md: 8px;   /* Metadata cards, dropdowns, panels */
  --radius-lg: 12px;  /* Cards, modals, search bar, preview panels */
  --radius-full: 9999px; /* Avatars, status dots, pills */

  /* Spacing Scale (4px base) */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;

  /* Elevation & Shadows */
  --shadow-card: 0 8px 30px rgba(0, 0, 0, 0.35);
  --shadow-primary-glow: 0 4px 14px rgba(99, 102, 241, 0.4);
  --ring-focus: 0 0 0 3px rgba(99, 102, 241, 0.25);
  --ring-error: 0 0 0 3px rgba(239, 68, 68, 0.25);
  
  /* Transitions */
  --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-normal: 200ms cubic-bezier(0.4, 0, 0.2, 1);
}

/* Eastside Stories — Loading Screen */

:root {
  --primary:      #ffc107;
  --accent:       #ffe9a8;
  --bg:           #0b0906;
  --text:         #ffffff;
  --muted:        rgba(255, 255, 255, 0.55);
  --glass-bg:     rgba(14, 18, 28, 0.88);
  --glass-border: rgba(255, 193, 7, 0.20);
  --radius-sm:    6px;
  --radius-md:    12px;
  --radius-lg:    18px;
}

*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body, #app {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

#app {
  position: relative;
  width: 100vw;
  height: 100vh;
}

/* BACKGROUND */

.bg-wrap {
  position: fixed;
  inset: 0;
  z-index: 0;
}

/* Latar animasi CSS: dipakai sebagai cadangan bila YouTube tak tampil. */
.bg-animated {
  position: absolute;
  inset: -20%;
  background:
    radial-gradient(circle at 22% 28%, rgba(255, 193, 7, 0.30) 0%, transparent 42%),
    radial-gradient(circle at 78% 68%, rgba(255, 193, 7, 0.16) 0%, transparent 46%),
    radial-gradient(circle at 52% 48%, rgba(255, 233, 168, 0.10) 0%, transparent 55%),
    linear-gradient(135deg, #120d05 0%, #1d1508 40%, #0b0906 100%);
  animation: bgDrift 24s ease-in-out infinite alternate;
  will-change: transform;
}

@keyframes bgDrift {
  0%   { transform: scale(1.04) translate3d(-1.5%, -1%, 0); }
  50%  { transform: scale(1.10) translate3d(1.5%, 1.5%, 0); }
  100% { transform: scale(1.05) translate3d(0.5%, -1.5%, 0); }
}

#bg-youtube {
  position: absolute;
  /* Skala lebih besar dari viewport supaya UI bawaan player YouTube
     (judul, tombol) terdorong keluar layar. */
  top: 50%;
  left: 50%;
  width: 177.78vh;          /* 16:9 dari tinggi layar */
  height: 56.25vw;          /* 16:9 dari lebar layar */
  min-width: 100%;
  min-height: 100%;
  transform: translate(-50%, -50%) scale(1.35);
  border: 0;
  pointer-events: none;
  background: transparent;
}

.bg-overlay-base {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    160deg,
    rgba(8, 6, 3, 0.80) 0%,
    rgba(8, 6, 3, 0.45) 55%,
    rgba(8, 6, 3, 0.74) 100%
  );
}

.bg-overlay-tint {
  position: absolute;
  inset: 0;
  background: var(--bg);
  opacity: 0;
  pointer-events: none;
}

.bg-vignette {
  position: absolute;
  inset: 0;
  background: radial-gradient(
    ellipse 80% 80% at 50% 50%,
    transparent 30%,
    rgba(6, 4, 2, 0.74) 100%
  );
  pointer-events: none;
}

.bg-scanlines {
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(0, 0, 0, 0.04) 3px,
    rgba(0, 0, 0, 0.04) 4px
  );
  pointer-events: none;
}

/* ROOT UI WRAPPER */

.ui-root {
  position: relative;
  z-index: 1;
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  opacity: 0;
  animation: uiFadeIn 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
}

@keyframes uiFadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* TOP BAR */

.top-bar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  padding: 26px 32px 0;
  flex-shrink: 0;
}

.status-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: 100px;
  border: 1px solid var(--glass-border);
  background: var(--glass-bg);
  animation: slideDown 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.5s both;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--primary);
  box-shadow: 0 0 8px var(--primary);
  animation: dotPulse 2.4s ease-in-out infinite;
}

@keyframes dotPulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--primary); }
  50%      { opacity: 0.4; box-shadow: 0 0 4px var(--primary); }
}

.status-label {
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-12px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* MUSIC PLAYER */

.music-player {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 13px 15px;
  min-width: 288px;
  max-width: 330px;
  border-radius: var(--radius-md);
  border: 1px solid var(--glass-border);
  background: var(--glass-bg);
  animation: slideDown 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.65s both;
}

.music-player.is-hidden {
  display: none;
}

.music-left {
  display: flex;
  align-items: center;
  gap: 11px;
}

.music-thumb {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-sm);
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid var(--glass-border);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  color: var(--primary);
}

.music-thumb svg {
  width: 20px;
  height: 20px;
}

.music-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.music-meta {
  flex: 1;
  min-width: 0;
}

.music-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.3;
}

.music-artist {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.06em;
  margin-top: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.music-right {
  display: flex;
  align-items: center;
  gap: 5px;
}

.mc-btn {
  width: 28px;
  height: 28px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--glass-border);
  background: rgba(255, 255, 255, 0.05);
  color: var(--muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.2s, color 0.2s, border-color 0.2s, box-shadow 0.2s;
}

.mc-btn svg {
  width: 13px;
  height: 13px;
  pointer-events: none;
}

.mc-btn:hover {
  background: rgba(255, 255, 255, 0.10);
  color: var(--primary);
  border-color: rgba(255, 193, 7, 0.45);
  box-shadow: 0 0 10px rgba(255, 193, 7, 0.18);
}

.mc-play {
  width: 34px;
  height: 34px;
  background: var(--primary);
  color: #0b0906;
  border-color: var(--primary);
}

.mc-play:hover {
  background: var(--accent);
  border-color: var(--accent);
  color: #0b0906;
  box-shadow: 0 0 18px rgba(255, 233, 168, 0.35);
}

.vol-slider {
  flex: 1;
  height: 3px;
  -webkit-appearance: none;
  appearance: none;
  background: rgba(255, 255, 255, 0.15);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
  min-width: 0;
}

.vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: var(--primary);
  cursor: pointer;
  box-shadow: 0 0 6px rgba(255, 193, 7, 0.6);
  transition: transform 0.15s;
}

.vol-slider::-webkit-slider-thumb:hover {
  transform: scale(1.25);
}

/* CONTENT AREA */

.content-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 62px 90px;
  gap: 32px;
  min-height: 0;
}

/* BRANDING BLOCK */

.brand-block {
  display: flex;
  flex-direction: column;
  gap: 26px;
  max-width: 520px;
  animation: brandIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.35s both;
}

@keyframes brandIn {
  from { opacity: 0; transform: translateX(-24px); }
  to   { opacity: 1; transform: translateX(0); }
}

.logo-wrap {
  display: flex;
  align-items: center;
  height: 104px;
}

.server-logo {
  height: 104px;
  width: auto;
  max-width: 280px;
  object-fit: contain;
  filter: drop-shadow(0 0 26px rgba(255, 193, 7, 0.35));
}

.server-logo.is-hidden {
  display: none;
}

.logo-fallback {
  height: 64px;
  width: 64px;
  color: var(--primary);
  display: none;
  align-items: center;
  justify-content: center;
}

.logo-fallback.is-visible {
  display: flex;
}

.logo-fallback svg {
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 0 12px rgba(255, 193, 7, 0.35));
}

.brand-text {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.brand-name {
  font-family: var(--font-display);
  font-size: clamp(30px, 4.2vw, 56px);
  font-weight: 700;
  letter-spacing: -0.03em;
  text-transform: uppercase;
  color: var(--text);
  line-height: 1;
  text-shadow:
    0 0 60px rgba(255, 193, 7, 0.22),
    0 2px 4px rgba(0, 0, 0, 0.6);
}

.brand-name em {
  font-style: normal;
  color: var(--primary);
}

.brand-rule {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 1px;
}

.brand-rule-line {
  flex: 1;
  max-width: 130px;
  height: 1px;
  background: linear-gradient(90deg, var(--primary), transparent);
}

.brand-rule-diamond {
  width: 5px;
  height: 5px;
  background: var(--primary);
  transform: rotate(45deg);
  flex-shrink: 0;
  opacity: 0.7;
  box-shadow: 0 0 6px var(--primary);
}

.brand-tagline {
  font-size: clamp(11px, 1.3vw, 14px);
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--primary);
  font-weight: 500;
  line-height: 1;
}

.brand-subtitle {
  font-size: clamp(10px, 1.1vw, 12px);
  color: var(--muted);
  letter-spacing: 0.08em;
  font-weight: 300;
  line-height: 1;
}

.social-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.social-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 15px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--glass-border);
  background: var(--glass-bg);
  color: var(--muted);
  font-family: inherit;
  font-size: 10px;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  font-weight: 500;
  cursor: default;
  -webkit-appearance: none;
  appearance: none;
  outline: none;
  transition: color 0.22s ease, border-color 0.22s ease, background 0.22s ease, box-shadow 0.22s ease, transform 0.22s ease;
}

.social-btn svg {
  width: 13px;
  height: 13px;
  flex-shrink: 0;
}

.social-btn:hover {
  color: var(--primary);
  border-color: rgba(255, 193, 7, 0.55);
  background: rgba(255, 193, 7, 0.08);
  box-shadow: 0 0 16px rgba(255, 193, 7, 0.16);
  transform: translateY(-2px);
}

/* STAFF PANEL */

.staff-panel {
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 22px 20px;
  min-width: 238px;
  max-width: 275px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--glass-border);
  background: var(--glass-bg);
  animation: staffIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.55s both;
  max-height: calc(100vh - 200px);
}

.staff-panel.is-hidden {
  display: none;
}

@keyframes staffIn {
  from { opacity: 0; transform: translateX(24px); }
  to   { opacity: 1; transform: translateX(0); }
}

.panel-cap {
  display: flex;
  align-items: center;
  gap: 12px;
}

.panel-cap-label {
  font-size: 9px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--primary);
  font-weight: 600;
  flex-shrink: 0;
}

.panel-cap-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, rgba(255, 193, 7, 0.55), transparent);
}

.staff-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow-y: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.staff-list::-webkit-scrollbar { display: none; }

.staff-card {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 8px 9px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  transition: background 0.22s, border-color 0.22s;
  opacity: 0;
  transform: translateX(12px);
  animation: cardIn 0.4s ease forwards;
}

@keyframes cardIn {
  to { opacity: 1; transform: translateX(0); }
}

.staff-card:hover {
  background: rgba(255, 255, 255, 0.04);
  border-color: var(--glass-border);
}

.staff-avatar {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid var(--glass-border);
  overflow: hidden;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  color: var(--primary);
}

.staff-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.staff-info {
  flex: 1;
  min-width: 0;
}

.staff-name {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.3;
}

.staff-role {
  font-size: 9.5px;
  color: var(--muted);
  letter-spacing: 0.07em;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.staff-online {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--primary);
  flex-shrink: 0;
  box-shadow: 0 0 7px rgba(255, 193, 7, 0.6);
}

/* BOTTOM BAR */

.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 16px 32px 26px;
  display: flex;
  flex-direction: column;
  gap: 9px;
  flex-shrink: 0;
  z-index: 10;
  animation: barIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.8s both;
}

@keyframes barIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.load-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.load-meta-left {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
}

.load-sep {
  display: block;
  width: 1px;
  height: 12px;
  background: var(--glass-border);
  flex-shrink: 0;
}

.load-text {
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 400;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.load-pct {
  font-family: var(--font-code);
  font-size: 13px;
  font-weight: 600;
  color: var(--primary);
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 12px rgba(255, 193, 7, 0.5);
}

.bar-track {
  position: relative;
  width: 100%;
  height: 2px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 2px;
}

.bar-fill {
  position: absolute;
  inset: 0;
  width: 0%;
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
}

.bar-fill::after {
  content: '';
  position: absolute;
  right: -1px;
  top: 50%;
  transform: translateY(-50%);
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent), 0 0 18px var(--primary);
  opacity: 0;
  transition: opacity 0.3s;
}

.bar-fill.is-active::after { opacity: 1; }

.bar-glow {
  position: absolute;
  top: 50%;
  left: 0;
  height: 1px;
  width: 0%;
  transform: translateY(-50%);
  background: linear-gradient(90deg, transparent, var(--accent));
  filter: blur(5px);
  opacity: 0.55;
  transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  pointer-events: none;
}

/* CONTROLS TOGGLE + OVERLAY */

.ctrl-toggle-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 13px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--glass-border);
  background: var(--glass-bg);
  color: var(--muted);
  font-family: inherit;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 500;
  cursor: pointer;
  flex-shrink: 0;
  -webkit-appearance: none;
  appearance: none;
  outline: none;
  transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
}

.ctrl-toggle-btn svg {
  width: 13px;
  height: 13px;
  flex-shrink: 0;
}

.ctrl-toggle-btn:hover,
.ctrl-toggle-btn.is-open {
  color: var(--primary);
  border-color: rgba(255, 193, 7, 0.55);
  background: rgba(255, 193, 7, 0.08);
  box-shadow: 0 0 14px rgba(255, 193, 7, 0.14);
}

.ctrl-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 20;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 0 32px 86px;
}

.ctrl-overlay.is-open {
  pointer-events: auto;
}

.ctrl-panel {
  width: 100%;
  max-width: 900px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--glass-border);
  background: rgba(12, 10, 6, 0.86);
  padding: 20px 24px 22px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  box-shadow:
    0 -4px 40px rgba(0, 0, 0, 0.5),
    0 0 0 1px rgba(255, 193, 7, 0.10);
  opacity: 0;
  transform: translateY(18px);
  transition: opacity 0.32s cubic-bezier(0.22, 1, 0.36, 1), transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
}

.ctrl-overlay.is-open .ctrl-panel {
  opacity: 1;
  transform: translateY(0);
}

.ctrl-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.ctrl-panel-heading {
  display: flex;
  align-items: center;
  gap: 9px;
}

.ctrl-panel-icon {
  color: var(--primary);
  display: flex;
  align-items: center;
}

.ctrl-panel-icon svg {
  width: 15px;
  height: 15px;
}

.ctrl-panel-title {
  font-size: 10px;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--primary);
  font-weight: 600;
}

.ctrl-close-btn {
  width: 26px;
  height: 26px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--glass-border);
  background: rgba(255, 255, 255, 0.04);
  color: var(--muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-appearance: none;
  appearance: none;
  outline: none;
  transition: color 0.2s, border-color 0.2s, background 0.2s;
}

.ctrl-close-btn svg {
  width: 13px;
  height: 13px;
}

.ctrl-close-btn:hover {
  color: var(--primary);
  border-color: rgba(255, 193, 7, 0.5);
  background: rgba(255, 193, 7, 0.08);
}

.ctrl-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: flex-start;
}

.key-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--glass-border);
  background: rgba(255, 255, 255, 0.03);
  min-width: 72px;
  cursor: default;
  transition: background 0.22s ease, border-color 0.22s ease, transform 0.22s ease, box-shadow 0.22s ease;
  opacity: 0;
  transform: translateY(8px);
  animation: keyCardIn 0.3s ease forwards;
}

@keyframes keyCardIn {
  to { opacity: 1; transform: translateY(0); }
}

.key-card:hover {
  background: rgba(255, 193, 7, 0.08);
  border-color: rgba(255, 193, 7, 0.45);
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(255, 193, 7, 0.12);
}

.key-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 36px;
  padding: 5px 8px;
  border-radius: 5px;
  background: var(--primary);
  color: #0b0906;
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.03em;
  line-height: 1;
  box-shadow:
    inset 0 -2px 0 rgba(0, 0, 0, 0.25),
    0 2px 8px rgba(255, 193, 7, 0.28);
}

.key-label {
  font-size: 9px;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 400;
  white-space: nowrap;
  text-align: center;
}

/* UTILITY */

.hidden {
  display: none !important;
}

/* HANDOFF ke menu login */

#bg-youtube,
.bg-animated {
  transition: opacity 0.55s ease;
}

html.is-handoff #bg-youtube,
html.is-handoff .bg-animated {
  opacity: 0;
}

html.is-handoff .ui-root,
html.is-handoff .bg-scanlines,
html.is-handoff .bg-vignette {
  /* animation-fill-mode: forwards pada .ui-root mengalahkan opacity biasa,
     jadi animasinya harus dimatikan eksplisit agar fade benar-benar jalan. */
  animation: none !important;
  opacity: 0;
  transition: opacity 0.45s ease;
}

html.is-handoff .bg-wrap::after {
  content: '';
  position: absolute;
  inset: 0;
  background: #000;
  opacity: 1;
  animation: handoffFade 0.5s ease forwards;
}

@keyframes handoffFade {
  from { opacity: 0; }
  to   { opacity: 1; }
}
