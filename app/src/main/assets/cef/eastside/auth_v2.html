<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Eastside Stories - Authentication</title>
    <!-- Genesis Design System Fonts: General Sans (Display) + DM Sans (Body) + JetBrains Mono (Code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">

html, body, #app {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
/* Genesis Design System Tokens */

:root {
  /* Colors */
  --genesis-primary: #6366F1;
  --genesis-primary-hover: #4F46E5;
  --genesis-secondary: #20970B;
  --genesis-neutral: #9C9C9C;
  --genesis-bg-light: #FAFAFA;
  --genesis-surface-light: #FFFFFF;
  --genesis-text-primary-light: #0A0A0A;
  --genesis-text-secondary-light: #6B6B6B;
  
  /* In-Game Dark Surface Variants (Transparent Overlay) */
  --genesis-bg-dark: rgba(10, 12, 20, 0.85);
  --genesis-surface-dark: rgba(18, 22, 36, 0.94);
  --genesis-surface-card: rgba(26, 32, 52, 0.85);
  --genesis-text-primary: #F8FAFC;
  --genesis-text-secondary: #94A3B8;
  --genesis-text-muted: #64748B;
  --genesis-border: rgba(232, 232, 236, 0.14);
  --genesis-border-focus: #6366F1;

  /* Semantic State Colors */
  --genesis-success: #10B981;
  --genesis-success-hover: #059669;
  --genesis-warning: #F59E0B;
  --genesis-error: #EF4444;
  --genesis-error-hover: #DC2626;

  /* Typography */
  --font-display: 'General Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-code: 'JetBrains Mono', monospace;

  /* Border Radius */
  --radius-xs: 4px;   /* Tags, chips, badges, inline code */
  --radius-sm: 6px;   /* Buttons, inputs, selects */
  --radius-md: 8px;   /* Metadata cards, dropdowns, panels */
  --radius-lg: 12px;  /* Cards, modals, search bar, preview panels */
  --radius-full: 9999px; /* Avatars, status dots, pills */

  /* Spacing Scale (4px base) */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;

  /* Elevation & Shadows */
  --shadow-card: 0 8px 30px rgba(0, 0, 0, 0.35);
  --shadow-primary-glow: 0 4px 14px rgba(99, 102, 241, 0.4);
  --ring-focus: 0 0 0 3px rgba(99, 102, 241, 0.25);
  --ring-error: 0 0 0 3px rgba(239, 68, 68, 0.25);
  
  /* Transitions */
  --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-normal: 200ms cubic-bezier(0.4, 0, 0.2, 1);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
}

input, textarea, select {
    user-select: text !important;
    -webkit-user-select: text !important;
    cursor: text !important;
}

html, body {
    width: 100vw;
    height: 100vh;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
    font-family: var(--font-body, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
}

#app {
    width: 100vw;
    height: 100vh;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(10, 12, 16, 0.75);
    z-index: 100;
}

/* Authentication Container - Guaranteed Screen Center */
.auth-container {
    width: 420px;
    background: rgba(18, 20, 26, 0.96);
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 8px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);
    padding: 32px 28px;
    color: #ffffff;
    margin: auto;
    transition: width 0.25s ease;
}

.auth-container.wide {
    width: 540px;
}

/* Server Brand Header */
.server-header {
    text-align: center;
    margin-bottom: 22px;
}

.server-logo {
    width: 76px;
    height: auto;
    margin: 0 auto 10px auto;
    display: block;
    filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.8));
}

.logo-title {
    font-family: var(--font-display, inherit);
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
}

.logo-azure {
    color: #38bdf8;
}

.logo-white {
    color: #ffffff;
}

.subtitle {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.5);
    margin-top: 4px;
    font-weight: 500;
}

/* Alert Error Banner */
.alert-error {
    display: none;
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.4);
    border-radius: 6px;
    padding: 10px 14px;
    color: #ef4444;
    font-size: 12.5px;
    margin-bottom: 16px;
    text-align: center;
    font-weight: 600;
}

/* User Tag Pill */
.user-tag {
    background: rgba(28, 32, 42, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 6px;
    padding: 9px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.tag-label {
    font-size: 11px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.5);
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.tag-val {
    font-family: var(--font-code, monospace);
    font-size: 13px;
    font-weight: 700;
    color: #ffffff;
}

/* Form Groups */
.form-group {
    margin-bottom: 16px;
}

.form-label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.6);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.form-input {
    width: 100%;
    padding: 11px 14px;
    background: rgba(10, 12, 16, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 6px;
    color: #ffffff;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s ease;
}

.form-input:focus {
    border-color: rgba(255, 255, 255, 0.4);
}

.form-hint {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.4);
    margin-top: 5px;
    line-height: 1.3;
}

/* Buttons */
.btn-primary {
    width: 100%;
    padding: 12px;
    background: #ffffff;
    border: none;
    border-radius: 6px;
    color: #0f1117;
    font-size: 13px;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    transition: background-color 0.15s ease;
}

.btn-primary:hover {
    background: #e2e8f0;
}

.btn-secondary {
    padding: 11px 16px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 6px;
    color: rgba(255, 255, 255, 0.85);
    font-size: 12.5px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    text-align: center;
    transition: background-color 0.15s ease, border-color 0.15s ease;
}

.btn-secondary:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.25);
}

.btn-row {
    display: flex;
    gap: 10px;
    margin-top: 18px;
}

/* Multi-step Panels */
.step-panel {
    display: none;
}

.step-panel.active {
    display: block;
}

/* Download Loader */
.download-box {
    padding: 10px 2px;
}

.download-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.download-file-label {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.6);
    font-weight: 600;
}

.download-percent-val {
    font-size: 14px;
    font-weight: 800;
    color: #38bdf8;
    font-family: var(--font-code, monospace);
    font-variant-numeric: tabular-nums;
}

.download-track {
    width: 100%;
    height: 6px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 3px;
    overflow: hidden;
}

.download-fill {
    height: 100%;
    width: 0%;
    background: #38bdf8;
    border-radius: 3px;
    transition: width 0.12s linear;
}

.download-subtext {
    text-align: center;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.4);
    margin-top: 14px;
}

/* Character Selector Cards (Authentic FiveM List) */
.char-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 18px;
    max-height: 290px;
    overflow-y: auto;
    padding-right: 2px;
}

.char-grid::-webkit-scrollbar {
    width: 4px;
}

.char-grid::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.2);
    border-radius: 2px;
}

.char-card {
    background: rgba(28, 32, 42, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 6px;
    padding: 13px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background-color 0.15s ease, border-color 0.15s ease;
}

.char-card:hover {
    border-color: rgba(255, 255, 255, 0.25);
    background: rgba(36, 42, 54, 0.95);
}

.char-info {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.char-name {
    font-family: var(--font-display, inherit);
    font-size: 14.5px;
    font-weight: 700;
    color: #ffffff;
}

.char-meta {
    font-size: 11.5px;
    color: rgba(255, 255, 255, 0.5);
    display: flex;
    gap: 8px;
}

.char-badge-lvl {
    color: #fbbf24;
    font-weight: 700;
}

.char-actions {
    display: flex;
    align-items: center;
    gap: 6px;
}

.btn-play {
    background: #10b981;
    border: none;
    border-radius: 4px;
    padding: 7px 16px;
    color: #ffffff;
    font-size: 12px;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    transition: background-color 0.15s ease;
}

.btn-play:hover {
    background: #059669;
}

.btn-del {
    background: transparent;
    border: 1px solid rgba(239, 68, 68, 0.35);
    border-radius: 4px;
    padding: 7px 11px;
    color: #ef4444;
    font-size: 11.5px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s ease;
}

.btn-del:hover {
    background: #ef4444;
    color: #ffffff;
}

.btn-new-char {
    width: 100%;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 6px;
    background: transparent;
    color: #ffffff;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    padding: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background-color 0.15s ease, border-color 0.15s ease;
}

.btn-new-char:hover {
    background: rgba(255, 255, 255, 0.06);
    border-color: rgba(255, 255, 255, 0.35);
}

/* Gender Selector */
.gender-selector {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
}

.gender-btn {
    flex: 1;
    padding: 10px;
    background: rgba(10, 12, 16, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 6px;
    color: rgba(255, 255, 255, 0.55);
    font-size: 12px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s ease;
}

.gender-btn.selected {
    background: rgba(56, 189, 248, 0.15);
    border-color: #38bdf8;
    color: #ffffff;
}

.footer-credit {
    text-align: center;
    font-size: 10.5px;
    color: rgba(255, 255, 255, 0.35);
    margin-top: 18px;
}
