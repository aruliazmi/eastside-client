<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Eastside Stories - Modern Game HUD</title>
    <!-- Genesis Design System Fonts: General Sans (Display) + DM Sans (Body) + JetBrains Mono (Code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
    <style>
html, body, #app {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
/* Genesis Design System Tokens */

:root {
  /* Colors */
  --genesis-primary: #6366F1;
  --genesis-primary-hover: #4F46E5;
  --genesis-secondary: #20970B;
  --genesis-neutral: #9C9C9C;
  --genesis-bg-light: #FAFAFA;
  --genesis-surface-light: #FFFFFF;
  --genesis-text-primary-light: #0A0A0A;
  --genesis-text-secondary-light: #6B6B6B;
  
  /* In-Game Dark Surface Variants (Transparent Overlay) */
  --genesis-bg-dark: rgba(10, 12, 20, 0.85);
  --genesis-surface-dark: rgba(18, 22, 36, 0.94);
  --genesis-surface-card: rgba(26, 32, 52, 0.85);
  --genesis-text-primary: #F8FAFC;
  --genesis-text-secondary: #94A3B8;
  --genesis-text-muted: #64748B;
  --genesis-border: rgba(232, 232, 236, 0.14);
  --genesis-border-focus: #6366F1;

  /* Semantic State Colors */
  --genesis-success: #10B981;
  --genesis-success-hover: #059669;
  --genesis-warning: #F59E0B;
  --genesis-error: #EF4444;
  --genesis-error-hover: #DC2626;

  /* Typography */
  --font-display: 'General Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-code: 'JetBrains Mono', monospace;

  /* Border Radius */
  --radius-xs: 4px;   /* Tags, chips, badges, inline code */
  --radius-sm: 6px;   /* Buttons, inputs, selects */
  --radius-md: 8px;   /* Metadata cards, dropdowns, panels */
  --radius-lg: 12px;  /* Cards, modals, search bar, preview panels */
  --radius-full: 9999px; /* Avatars, status dots, pills */

  /* Spacing Scale (4px base) */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;

  /* Elevation & Shadows */
  --shadow-card: 0 8px 30px rgba(0, 0, 0, 0.35);
  --shadow-primary-glow: 0 4px 14px rgba(99, 102, 241, 0.4);
  --ring-focus: 0 0 0 3px rgba(99, 102, 241, 0.25);
  --ring-error: 0 0 0 3px rgba(239, 68, 68, 0.25);
  
  /* Transitions */
  --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-normal: 200ms cubic-bezier(0.4, 0, 0.2, 1);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: var(--font-body);
    user-select: none;
}

:root {
    /* ====================================================================
       Tuff Advance HUD 2.0 palette — tokens taken from the resource's
       release thread (forum.cfx.re/t/free-tuff-advance-hud-2-0/5392029)
       and its published settings/config docs.
       ==================================================================== */
    --tuff-surface: #0E0F11;
    --tuff-surface-2: #141518;
    --tuff-surface-3: #191B1F;
    --tuff-line: rgba(240, 247, 250, 0.07);
    --tuff-line-lit: rgba(240, 247, 250, 0.16);
    --tuff-text: #F0F7FA;
    --tuff-dim: rgba(240, 247, 250, 0.55);
    --tuff-mute: rgba(240, 247, 250, 0.32);
    --tuff-shadow: 0 10px 30px rgba(0, 0, 0, 0.62);
    --tuff-panel: linear-gradient(180deg, rgba(20, 21, 24, 0.94) 0%, rgba(14, 15, 17, 0.96) 100%);
    --tuff-lime: #C4FF48;
    --tuff-mint: #00FFA6;
    --tuff-cyan: #00D0FF;
    --tuff-yellow: #FFD373;
    --tuff-red: #FF635C;

    /* --- legacy --vhud-* names remapped onto the Tuff palette ----------- */
    --vhud-bg: var(--tuff-surface);
    --vhud-panel: var(--tuff-panel);
    --vhud-panel-solid: var(--tuff-surface-2);
    --vhud-line: var(--tuff-line);
    --vhud-line-lit: var(--tuff-line-lit);
    --vhud-shadow: var(--tuff-shadow);
    --vhud-accent: var(--tuff-cyan);    /* water / armour / focus       */
    --vhud-gold: var(--tuff-yellow);    /* food / warning               */
    --vhud-green: var(--tuff-mint);     /* cash / success / mood        */
    --vhud-red: var(--tuff-red);        /* low stats / destructive      */
    --vhud-lime: var(--tuff-lime);      /* speed / fuel / primary CTA   */
}

body {
    background: transparent;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    pointer-events: none;
    position: relative;
}

/* Server logo (top right) */
.server-logo-top {
    /* Top-left: Tuff puts the brand mark opposite the notification feed, and
       the toasts own the top-right corner, so they no longer collide. */
    position: absolute;
    top: 20px;
    left: 24px;
    right: auto;
    transform: none;
    display: flex;
    align-items: center;
    opacity: 0.95;
    z-index: 90;
}

.server-logo-img {
    width: 62px;
    height: auto;
    max-height: 52px;
    filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 16px rgba(0, 208, 255, 0.35));
    animation: logoPulse 4s ease-in-out infinite alternate;
}

@keyframes logoPulse {
    from {
        transform: scale(1);
        filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 16px rgba(255, 211, 115, 0.25));
    }
    to {
        transform: scale(1.03);
        filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 25px rgba(255, 211, 115, 0.45));
    }
}

/* HBE status gauges (v-hud vertical tile stack at RIGHT CENTER - NO PERCENTAGE TEXT) */
.hbe-vertical-stack {
    position: absolute;
    right: 28px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    background: transparent;
    padding: 0;
    pointer-events: none;
    z-index: 100;
}

.vhud-tile {
    position: relative;
    width: 40px;
    height: 40px;
    background: rgba(20, 21, 24, 0.90);
    border: 1px solid var(--vhud-line);
    border-top: 1px solid var(--vhud-line-lit);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.65);
    transition: transform 0.2s ease, border-color 0.2s ease;
}

.vhud-tile-fill {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 100%;
    background: var(--tile-col);
    opacity: 0.85;
    transition: height 0.35s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease;
    z-index: 1;
}

.vhud-tile.is-warning {
    animation: vhudPulse 1.1s ease-in-out infinite alternate;
    border-color: rgba(255, 99, 92, 0.85);
    box-shadow: 0 0 14px rgba(255, 99, 92, 0.6);
}

.vhud-tile.is-warning .vhud-tile-fill {
    background: #FF635C !important;
}

@keyframes vhudPulse {
    0% { transform: scale(1); }
    100% { transform: scale(1.08); }
}

.vhud-tile-icon {
    position: relative;
    z-index: 2;
    width: 21px;
    height: 21px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
}

.vhud-tile-icon svg {
    width: 100%;
    height: 100%;
    fill: #F0F7FA;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.9));
}

/* Floating Compass (v-hud Top Center per user request) */
.vhud-compass-top {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    pointer-events: none;
    z-index: 100;
}

.cmp-bearings-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 30px;
}

.cmp-bearing-main {
    font-family: var(--font-display);
    font-size: 21px;
    font-weight: 800;
    color: #F0F7FA;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9), 0 0 12px rgba(240, 247, 250, 0.4);
    min-width: 28px;
    text-align: center;
}

.cmp-bearing-sub {
    font-family: var(--font-display);
    font-size: 13.5px;
    font-weight: 700;
    color: rgba(240, 247, 250, 0.38);
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    min-width: 28px;
    text-align: center;
}

.cmp-pointer-arrow {
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 0 6px #00D0FF);
    margin-top: -1px;
}

.cmp-degree-text {
    font-family: var(--font-code);
    font-size: 11.5px;
    font-weight: 700;
    color: #00D0FF;
    letter-spacing: 0.05em;
    text-shadow: 0 0 8px rgba(0, 208, 255, 0.6);
    font-variant-numeric: tabular-nums;
}

/* Street Name Box (Bottom Left, directly above GTA SA Minimap) */
.vhud-street-box {
    position: absolute;
    bottom: 180px;
    left: 24px;
    background: var(--vhud-panel);
    border: 1px solid var(--vhud-line);
    border-top: 1px solid var(--vhud-line-lit);
    border-radius: var(--radius-md);
    padding: 7px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: var(--vhud-shadow);
    pointer-events: none;
    z-index: 95;
    max-width: 280px;
}

.street-cardinal-badge {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    background: rgba(0, 208, 255, 0.15);
    border: 1px solid rgba(0, 208, 255, 0.35);
    color: #00D0FF;
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.street-text-col {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
    overflow: hidden;
}

.street-name-main {
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 700;
    color: #F0F7FA;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
}

.street-subtitle-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    font-weight: 600;
    color: rgba(240, 247, 250, 0.55);
}

.street-sub-name {
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-family: var(--font-display);
    color: rgba(240, 247, 250, 0.65);
}

.street-dot {
    color: rgba(240, 247, 250, 0.35);
    font-size: 9px;
}

.street-clock {
    font-family: var(--font-code);
    color: var(--vhud-gold);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
}

/* Checkpoint / Destination Capsule (Bottom Left, docked above Street Box) */
.checkpoint-widget {
    position: absolute;
    bottom: 232px;
    left: 24px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--vhud-panel);
    border: 1px solid var(--vhud-line);
    border-left: 3px solid var(--vhud-gold);
    border-radius: 999px;
    padding: 6px 14px 6px 10px;
    box-shadow: var(--vhud-shadow), 0 0 16px rgba(255, 211, 115, 0.2);
    pointer-events: none;
    z-index: 96;
    opacity: 0;
    visibility: hidden;
    transform: translateY(6px);
    transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
    will-change: opacity, transform;
}

.checkpoint-widget.active {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.checkpoint-icon-box {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(255, 211, 115, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.checkpoint-svg {
    width: 12px;
    height: 12px;
    fill: var(--vhud-gold);
}

.checkpoint-text-col {
    display: flex;
    align-items: baseline;
    gap: 5px;
    min-width: 0;
}

.checkpoint-hint {
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    color: rgba(240, 247, 250, 0.45);
    letter-spacing: 0.05em;
}

.checkpoint-target {
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 700;
    color: #F0F7FA;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 150px;
}

.checkpoint-distance {
    font-family: var(--font-code);
    font-size: 11.5px;
    font-weight: 800;
    color: var(--vhud-green);
    text-shadow: 0 0 8px rgba(0, 255, 166, 0.5);
    font-variant-numeric: tabular-nums;
    margin-left: 2px;
}

/* Speedometer Cluster (v-hud FiveM supercar digital cluster from reference image) */
.vhud-cluster-box {
    position: absolute;
    bottom: 26px;
    right: 30px;
    width: 275px;
    background: var(--vhud-panel);
    border: 1px solid var(--vhud-line);
    border-top: 1px solid var(--vhud-line-lit);
    border-radius: 12px;
    box-shadow: var(--vhud-shadow), 0 0 24px rgba(0, 0, 0, 0.75);
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    opacity: 0;
    transform: translateY(12px) scale(0.96);
    pointer-events: none;
    visibility: hidden;
    transition: opacity 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0.25s;
    z-index: 100;
}

.vhud-cluster-box.active {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
    visibility: visible;
}

/* Top RPM Bar with Segments & Numbers 0-9 */
.cluster-rpm-container {
    display: flex;
    flex-direction: column;
    gap: 2px;
    width: 100%;
}

.cluster-rpm-bar {
    position: relative;
    width: 100%;
    height: 7px;
    background: rgba(0, 0, 0, 0.65);
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid rgba(240, 247, 250, 0.08);
}

.cluster-rpm-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #00D0FF 0%, #00FFA6 60%, #FFD373 80%, #FF635C 100%);
    transition: width 0.1s linear;
}

.cluster-rpm-segments {
    position: absolute;
    inset: 0;
    display: flex;
    pointer-events: none;
}

.rpm-seg {
    flex: 1;
    border-right: 1px solid rgba(0, 0, 0, 0.85);
}

.cluster-rpm-labels {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-code);
    font-size: 8px;
    font-weight: 700;
    color: rgba(240, 247, 250, 0.5);
    padding: 0 1px;
    font-variant-numeric: tabular-nums;
}

/* Main Speed & Gear Row */
.cluster-main-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 2px;
}

.cluster-speed-group {
    display: flex;
    align-items: baseline;
    gap: 6px;
}

.cluster-speed-val {
    font-family: var(--font-display);
    font-size: 46px;
    font-weight: 800;
    line-height: 0.9;
    color: #F0F7FA;
    letter-spacing: -0.04em;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
    font-variant-numeric: tabular-nums;
}

.cluster-speed-unit {
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 800;
    color: rgba(240, 247, 250, 0.6);
    letter-spacing: 0.08em;
}

.cluster-gear-badge {
    width: 32px;
    height: 32px;
    border-radius: 7px;
    background: rgba(20, 21, 24, 0.9);
    border: 1px solid rgba(0, 208, 255, 0.5);
    color: #00D0FF;
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 10px rgba(0, 208, 255, 0.25);
}

/* Sub Info Row: Vehicle Model & Odometer */
.cluster-info-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 2px;
}

.cluster-veh-name {
    font-family: var(--font-display);
    font-size: 11px;
    font-weight: 700;
    color: #F0F7FA;
    letter-spacing: 0.05em;
    text-transform: uppercase;
}

.cluster-odometer {
    font-family: var(--font-code);
    font-size: 9.5px;
    font-weight: 700;
    color: rgba(240, 247, 250, 0.65);
    border: 1px solid rgba(240, 247, 250, 0.12);
    border-radius: 4px;
    padding: 2px 6px;
    font-variant-numeric: tabular-nums;
}

/* Sliders Row: Fuel & Temp */
.cluster-sliders-row {
    display: flex;
    gap: 14px;
    border-top: 1px solid var(--vhud-line);
    padding-top: 8px;
}

.slider-block {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.slider-track-wrap {
    display: flex;
    align-items: center;
    gap: 5px;
}

.slider-cap {
    font-family: var(--font-code);
    font-size: 8.5px;
    font-weight: 800;
    color: rgba(240, 247, 250, 0.55);
}

.slider-track {
    flex: 1;
    height: 5px;
    background: rgba(0, 0, 0, 0.65);
    border: 1px solid rgba(240, 247, 250, 0.1);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
}

.slider-fill {
    height: 100%;
    width: 100%;
    border-radius: 999px;
    transition: width 0.2s linear, background-color 0.2s ease;
}

.slider-fuel-fill {
    background: #00FFA6;
    box-shadow: 0 0 6px rgba(0, 255, 166, 0.6);
}

.slider-hp-fill {
    background: #00D0FF;
    box-shadow: 0 0 6px rgba(0, 208, 255, 0.6);
}

.slider-name {
    font-family: var(--font-display);
    font-size: 8px;
    font-weight: 800;
    color: rgba(240, 247, 250, 0.45);
    letter-spacing: 0.08em;
    text-align: center;
}

/* Tell-Tale Status Icons */
.cluster-tell-tales {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--vhud-line);
    padding-top: 8px;
    margin-top: 2px;
}

.tell-icon {
    width: 22px;
    height: 22px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(240, 247, 250, 0.20);
    transition: all 0.2s ease;
}

.tell-icon svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
}

.tell-icon.active {
    color: #F0F7FA;
}

.icon-signal {
    font-weight: 900;
    font-size: 16px;
    line-height: 1;
    color: rgba(240, 247, 250, 0.20);
}

.icon-signal.active {
    color: var(--vhud-green);
    text-shadow: 0 0 8px rgba(0, 255, 166, 0.8);
}

/* Engine running: Green neon */
.icon-engine.active {
    color: #00FFA6;
    filter: drop-shadow(0 0 6px rgba(0, 255, 166, 0.75));
}

/* Headlights turned on: Cyan neon */
.icon-lights.active {
    color: #00D0FF;
    filter: drop-shadow(0 0 6px rgba(0, 208, 255, 0.75));
}

/* Doors locked: Amber neon */
.icon-lock.active {
    color: #FFD373;
    filter: drop-shadow(0 0 6px rgba(255, 211, 115, 0.75));
}

/* Seatbelt buckled vs unbuckled */
.icon-seatbelt.unbuckled {
    color: #FF635C;
    animation: vhudPulse 1s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 6px rgba(255, 99, 92, 0.75));
}

.icon-seatbelt.buckled {
    color: #00FFA6;
    filter: drop-shadow(0 0 5px rgba(0, 255, 166, 0.5));
}

/* Notification toasts (v-hud style) */
.toast-container {
    position: absolute;
    top: 24px;
    right: 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 9999;
    pointer-events: none;
}

.toast {
    width: 320px;
    background: var(--vhud-panel);
    border-radius: var(--radius-md);
    padding: 12px 16px;
    border: 1px solid var(--vhud-line);
    border-top: 1px solid var(--vhud-line-lit);
    border-left: 4px solid var(--vhud-accent);
    box-shadow: var(--vhud-shadow);
    animation: toastSlideIn 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    transition: all var(--transition-fast);
}

.toast.fade-out {
    opacity: 0;
    transform: translateX(30px);
}

.toast.success { border-left-color: var(--vhud-green); }
.toast.error { border-left-color: var(--vhud-red); }
.toast.warning { border-left-color: var(--vhud-gold); }
.toast.info { border-left-color: var(--vhud-accent); }

@keyframes toastSlideIn {
    from { opacity: 0; transform: translateX(40px); }
    to { opacity: 1; transform: translateX(0); }
}

.toast-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
}

.toast-title {
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 700;
    color: #F0F7FA;
    letter-spacing: -0.02em;
}

.toast-time {
    font-family: var(--font-code);
    font-size: 10px;
    color: rgba(240, 247, 250, 0.5);
    font-variant-numeric: tabular-nums;
}

.toast-body {
    font-size: 12px;
    color: rgba(240, 247, 250, 0.75);
    line-height: 1.4;
}

/* Modals & dialogs (v-hud glass style) */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    z-index: 10000;
    opacity: 0;
    transition: opacity var(--transition-fast);
}

.modal-overlay.active {
    display: flex;
    opacity: 1;
}

.modal-card {
    background: var(--vhud-panel);
    border: 1px solid var(--vhud-line);
    border-top: 1px solid var(--vhud-line-lit);
    border-radius: var(--radius-lg);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85), 0 0 35px rgba(0, 208, 255, 0.12);
    color: #F0F7FA;
    padding: 24px 28px;
    max-height: 85vh;
    overflow-y: auto;
    animation: modalPop 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    position: relative;
}

@keyframes modalPop {
    from { transform: scale(0.92) translateY(15px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--vhud-line);
    margin-bottom: 20px;
}

.modal-title-box {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.modal-title {
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: #F0F7FA;
}

.modal-subtitle {
    font-size: 12px;
    color: rgba(240, 247, 250, 0.6);
}

.btn-modal-close {
    background: rgba(240, 247, 250, 0.08);
    border: 1px solid rgba(240, 247, 250, 0.15);
    width: 32px;
    height: 32px;
    border-radius: 8px;
    color: #F0F7FA;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
}

.btn-modal-close:hover {
    background: rgba(255, 99, 92, 0.8);
    border-color: #FF635C;
}

/* Modal sizing */
.modal-stats { width: 560px; }
.modal-inv { width: 620px; }
.modal-atm { width: 480px; }
.modal-vmenu { width: 440px; }
.modal-gas { width: 420px; }
.modal-help { width: 640px; }

/* FLEECA BANK / ATM (FIVEM NOPIXEL AUTHENTIC) */
.modal-fleeca {
    width: 900px !important;
    height: 520px !important;
    max-width: 95vw;
    padding: 0 !important;
    background: #141518 !important;
    border: 1px solid rgba(240, 247, 250, 0.08) !important;
    border-radius: 12px !important;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85) !important;
    overflow: hidden !important;
    user-select: none;

.fleeca-wrapper {
    display: flex;
    width: 100%;
    height: 100%;
}

/* 1. Left Sidebar */

    border-right: 1px solid rgba(240, 247, 250, 0.06);

}

.fleeca-brand {
    margin-bottom: 32px;

}

.brand-text {
    font-family: var(--font-display, inherit);
    font-size: 22px;
    font-weight: 900;
    font-style: italic;
    color: #F0F7FA;
    letter-spacing: 0.08em;
}

.brand-green {
    color: #00FFA6;
}

.fleeca-nav {
    display: flex;
    flex-direction: column;
    gap: 8px;

}

.fleeca-nav-btn {

    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 20px;
    background: transparent;
    border: none;
    color: rgba(240, 247, 250, 0.55);
    font-size: 13.5px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s ease;

}

.fleeca-nav-btn .nav-icon {
    width: 18px;
    height: 18px;
    stroke-width: 2.2;
}

.fleeca-nav-btn:hover {
    color: #F0F7FA;
    background: rgba(240, 247, 250, 0.04);
}

.fleeca-nav-btn.active {
    background: #191B1F;
    color: #00FFA6;
    font-weight: 700;
}

.fleeca-nav-btn.active .nav-icon {
    color: #00FFA6;
    stroke: #00FFA6;
}

.fleeca-sidebar-footer {
    padding-top: 16px;
    border-top: 1px solid rgba(240, 247, 250, 0.05);
}

.fleeca-close-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: transparent;
    border: none;
    color: rgba(240, 247, 250, 0.55);
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    width: 100%;
    transition: color 0.15s ease;
}

.fleeca-close-btn .close-icon {
    width: 18px;
    height: 18px;
}

.fleeca-close-btn:hover {
    color: #FF635C;
}

/* 2. Center Column: Virtual Card & Controls */
.fleeca-center {
    flex: 1;
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    overflow-y: auto;
}

/* Virtual Card */
.fleeca-card {
    width: 100%;
    height: 185px;
    background: linear-gradient(135deg, #191B1F 0%, #191B1F 100%);
    border: 1px solid rgba(240, 247, 250, 0.12);
    border-top: 1px solid rgba(240, 247, 250, 0.25);
    border-radius: 14px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    padding: 20px 24px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    margin-bottom: 22px;
    position: relative;
    overflow: hidden;
}

.fleeca-card::after {
    content: '';
    position: absolute;
    top: -50px;
    right: -50px;
    width: 180px;
    height: 180px;
    background: radial-gradient(circle, rgba(0, 255, 166, 0.08) 0%, transparent 70%);
    pointer-events: none;
}

.card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

.card-balance-box {
    display: flex;
    flex-direction: column;
}

.card-bal-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    font-weight: 700;
    color: rgba(240, 247, 250, 0.55);
    margin-bottom: 2px;
}

.card-balance {
    font-size: 26px;
    font-weight: 800;
    color: #F0F7FA;
    font-family: var(--font-code, monospace);
    letter-spacing: -0.02em;
}

.card-watermark {
    font-size: 20px;
    font-weight: 900;
    color: rgba(240, 247, 250, 0.12);
    font-family: var(--font-display, inherit);
    letter-spacing: 0.1em;
}

.card-number {
    font-family: var(--font-code, monospace);
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 0.22em;
    color: rgba(240, 247, 250, 0.95);
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
}

.card-bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
}

.card-holder {
    display: flex;
    flex-direction: column;
}

.card-holder-label {
    font-size: 9.5px;
    letter-spacing: 0.1em;
    font-weight: 700;
    color: rgba(240, 247, 250, 0.55);
    margin-bottom: 1px;
}

.card-holder-name {
    font-size: 13.5px;
    font-weight: 700;
    color: #F0F7FA;
    text-transform: uppercase;
    letter-spacing: 0.06em;
}

.card-badge {
    background: #00D0FF;
    border-radius: 4px;
    padding: 3px 10px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
}

.card-badge-net {
    font-size: 11px;
    font-weight: 900;
    color: #F0F7FA;
    font-style: italic;
    letter-spacing: 0.08em;
}

/* Tab Contents */
.fleeca-tab-content {
    display: flex;
    flex-direction: column;
}

.fleeca-input-group {
    display: flex;
    align-items: center;
    background: #191B1F;
    border: 1px solid rgba(240, 247, 250, 0.10);
    border-radius: 8px;
    padding: 4px 16px;
    margin-bottom: 14px;
    transition: border-color 0.15s ease;
}

.fleeca-input-group:focus-within {
    border-color: #00FFA6;
}

.input-currency {
    font-size: 19px;
    font-weight: 800;
    color: #00FFA6;
    margin-right: 10px;
    font-family: var(--font-code, monospace);
}

.fleeca-amount-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #F0F7FA;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    padding: 8px 0;
    user-select: text !important;
}

.fleeca-amount-input::placeholder {
    color: rgba(240, 247, 250, 0.32);
}

.fleeca-btn-row {
    display: flex;
    gap: 12px;
    margin-bottom: 14px;
}

.fleeca-action-btn {
    flex: 1;
    padding: 12px;
    background: #191B1F;
    border: 1px solid rgba(240, 247, 250, 0.08);
    border-radius: 8px;
    color: #00FFA6;
    font-size: 13.5px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s ease;
}

.fleeca-action-btn:hover {
    background: #191B1F;
    border-color: #00FFA6;
    color: #F0F7FA;
}

.fleeca-quick-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
}

.quick-chip {
    flex: 1;
    padding: 7px 4px;
    background: rgba(240, 247, 250, 0.04);
    border: 1px solid rgba(240, 247, 250, 0.08);
    border-radius: 6px;
    color: rgba(240, 247, 250, 0.55);
    font-size: 11.5px;
    font-weight: 600;
    font-family: var(--font-code, monospace);
    cursor: pointer;
    text-align: center;
    transition: all 0.15s ease;
}

.quick-chip:hover {
    background: rgba(0, 255, 166, 0.12);
    border-color: #00FFA6;
    color: #00FFA6;
}

.fleeca-cash-info {
    font-size: 12px;
    color: rgba(240, 247, 250, 0.55);
    display: flex;
    justify-content: space-between;
    padding: 8px 4px;
    border-top: 1px solid rgba(240, 247, 250, 0.05);
}

.fleeca-cash-info b {
    color: #00D0FF;
    font-family: var(--font-code, monospace);
}

/* Transfer Tab Styles */
.transfer-title {
    font-size: 15px;
    font-weight: 700;
    color: #F0F7FA;
    margin-bottom: 4px;
}

.transfer-subtitle {
    font-size: 12px;
    color: rgba(240, 247, 250, 0.55);
    margin-bottom: 16px;
}

.fleeca-field {
    margin-bottom: 14px;
}

.field-label {
    display: block;
    font-size: 10.5px;
    font-weight: 700;

.fleeca-field-input {
    width: 100%;
    padding: 10px 14px;
    background: #191B1F;
    border: 1px solid rgba(240, 247, 250, 0.10);
    border-radius: 8px;
    color: #F0F7FA;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    outline: none;
    box-sizing: border-box;

}

.fleeca-field-input:focus {
    border-color: #00FFA6;
}

.fleeca-primary-btn {
    width: 100%;
    padding: 12px;
    background: #00FFA6;
    border: none;
    border-radius: 8px;
    color: #F0F7FA;
    font-size: 13.5px;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;

.fleeca-primary-btn:hover {

/* Paycheck Tab */
.paycheck-amount-card {
    background: #191B1F;
    border: 1px solid rgba(240, 247, 250, 0.10);
    border-radius: 8px;

    text-align: center;
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.paycheck-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: rgba(240, 247, 250, 0.55);
}

.paycheck-value {
    font-size: 26px;
    font-weight: 800;
    color: #00FFA6;
    font-family: var(--font-code, monospace);
}

/* 3. Right Column: Transaction History */
.fleeca-history {
    width: 270px;
    background: #141518;
    border-left: 1px solid rgba(240, 247, 250, 0.06);
    display: flex;
    flex-direction: column;
    padding: 20px 18px;
    box-sizing: border-box;
}

.history-header {
    font-size: 15px;
    font-weight: 700;
    color: #F0F7FA;
    margin-bottom: 14px;
}

.history-list {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-right: 6px;
}

.history-list::-webkit-scrollbar {
    width: 4px;
}

.history-list::-webkit-scrollbar-thumb {
    background: #00FFA6;
    border-radius: 999px;
}

.history-item {
    background: #191B1F;
    border: 1px solid rgba(240, 247, 250, 0.06);
    border-radius: 6px;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.hist-left {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.hist-amount {
    font-size: 13.5px;
    font-weight: 700;
    font-family: var(--font-code, monospace);
}

.hist-amount.positive {
    color: #00FFA6;
}

.hist-amount.negative {
    color: #FF635C;
}

.hist-desc {
    font-size: 11px;
    color: #F0F7FA;
    font-weight: 600;
}

.hist-time {
    font-size: 10px;
    color: rgba(240, 247, 250, 0.55);
}

/* Grid & Info Rows */
.stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.info-tile {
    background: rgba(20, 21, 24, 0.85);
    border: 1px solid var(--vhud-line);
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.tile-label {
    font-size: 11px;
    color: rgba(240, 247, 250, 0.5);
    text-transform: uppercase;
    font-weight: 600;
}

.tile-value {
    font-size: 14px;
    font-weight: 800;
    color: #F0F7FA;
}

.tile-value.green { color: var(--vhud-green); }
.tile-value.blue { color: var(--vhud-accent); }
.tile-value.gold { color: var(--vhud-gold); }

    border: none !important;
    box-shadow: none !important;
    padding: 0 !important;
}

.esx-inv-wrapper {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 16px;
    width: 100%;
    max-width: 1140px;
    padding: 10px;
    pointer-events: auto;
    position: relative;
    user-select: none;
}

.esx-inv-panel {
    flex: 1;
    min-width: 460px;
    max-width: 490px;
    display: flex;
    flex-direction: column;
    gap: 8px;

.esx-inv-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

.esx-inv-title {

    font-size: 14px;
    font-weight: 800;
    color: #F0F7FA;
    letter-spacing: 0.08em;

.esx-inv-sub {

    font-size: 12px;

.esx-inv-grid {

.esx-inv-grid::-webkit-scrollbar {

}
.esx-inv-grid::-webkit-scrollbar-thumb {
    background: rgba(240, 247, 250, 0.2);

/* Individual Slot Card */
.esx-item-card {
    position: relative;
    width: 100%;
    height: 108px;
    background: rgba(20, 21, 24, 0.78);
    border: 1px solid rgba(240, 247, 250, 0.08);

    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;

    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;

.esx-item-card:hover {
    border-color: rgba(240, 247, 250, 0.35);
    background: rgba(20, 21, 24, 0.88);

.esx-item-card.selected {

    background: rgba(20, 21, 24, 0.90);
    box-shadow: 0 0 12px rgba(0, 208, 255, 0.45);

.esx-item-card.ground-card.selected {

    background: rgba(0, 255, 166, 0.18);
    box-shadow: 0 0 12px rgba(0, 255, 166, 0.45);
}

.esx-item-count {

    top: 4px;
    right: 6px;
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 700;
    color: #F0F7FA;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);

.esx-item-icon-wrap {

    align-items: center;
    justify-content: center;
    padding: 8px 6px 2px 6px;

.esx-item-icon {
    max-width: 58px;
    max-height: 58px;

.esx-item-card:hover .esx-item-icon {

.esx-item-name {

    background: rgba(14, 15, 17, 0.88);
    border-top: 1px solid rgba(240, 247, 250, 0.05);

    font-size: 10.5px;
    font-weight: 700;
    color: #F0F7FA;
    text-align: center;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;

    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding-top: 28px;
    flex-shrink: 0;

.esx-qty-box {
    width: 100%;
}

.esx-qty-input {
    width: 100%;
    height: 38px;
    background: rgba(20, 21, 24, 0.85);
    border: 1px solid rgba(240, 247, 250, 0.2);
    border-radius: 3px;
    color: #F0F7FA;
    font-family: var(--font-code);
    font-size: 15px;
    font-weight: 700;
    text-align: center;
    outline: none;
    transition: border-color 0.2s ease;

.esx-qty-input:focus {

    box-shadow: 0 0 8px rgba(0, 208, 255, 0.4);

.esx-btn {
    width: 100%;
    height: 38px;
    border-radius: 3px;
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    cursor: pointer;
    background: rgba(20, 21, 24, 0.90);
    border: 1px solid rgba(240, 247, 250, 0.12);
    color: #F0F7FA;
    transition: all 0.15s ease;

.esx-btn:hover {

    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);

.esx-btn-use:hover {
    background: #00D0FF;

    color: #F0F7FA;

.esx-btn-give:hover {
