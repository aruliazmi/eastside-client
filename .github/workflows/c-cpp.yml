name: Build APK Windows (Debug Version)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout our optimized repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Checkout upstream repository with LFS
        uses: actions/checkout@v4
        with:
          repository: Kallzzxa/SA-MP-Mobile-Launcher
          lfs: true
          path: upstream-repo

      - name: Copy real LFS binary files from upstream
        shell: powershell
        run: |
          $root = (Get-Location).Path
          $upstream = Join-Path $root "upstream-repo"
          Get-ChildItem -Path $upstream -Recurse -Include *.so, *.a | ForEach-Object {
              $fullPath = $_.FullName
              $relPath = $fullPath.Substring($upstream.Length).TrimStart('\', '/')
              $destPath = Join-Path $root $relPath
              $destDir = Split-Path -Parent $destPath
              if (-not (Test-Path $destDir)) { New-Item -ItemType Directory -Force -Path $destDir }
              Copy-Item -Path $fullPath -Destination $destPath -Force
              Write-Host "Restored binary: $relPath ($($_.Length) bytes)"
          }
          Remove-Item -Recurse -Force $upstream

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true

      - name: Enable long paths
        shell: powershell
        run: |
          git config --system core.longpaths true
          reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f

      - name: Grant gradlew permission
        shell: cmd
        run: |
          if not exist gradlew.bat exit /b 1

      # Build APK
      - name: Build Debug APK
        shell: cmd
        run: |
          gradlew.bat assembleRelease --stacktrace

      - name: List generated APKs
        shell: powershell
        run: |
          Get-ChildItem -Path . -Recurse -Filter *.apk | Select-Object FullName, Length
          New-Item -ItemType Directory -Force -Path "release-apks"
          Get-ChildItem -Path "app\build" -Recurse -Filter "*release*.apk" | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination "release-apks" -Force
          }
          Get-ChildItem -Path "release-apks" -Filter *.apk | Select-Object FullName, Length

      # Patch 16KB Page Alignment on Native Libraries
      - name: Patch 16KB Page Alignment on Native Libraries
        shell: python
        run: |
          import os, zipfile, struct, shutil

          for root, dirs, files in os.walk("release-apks"):
              for file in files:
                  if file.endswith(".apk"):
                      apk_path = os.path.join(root, file)
                      tmp_dir = "tmp_patch"
                      if os.path.exists(tmp_dir): shutil.rmtree(tmp_dir)
                      os.makedirs(tmp_dir)
                      with zipfile.ZipFile(apk_path, "r") as z:
                          z.extractall(tmp_dir)
                      for r, d, fs in os.walk(os.path.join(tmp_dir, "lib")):
                          for f in fs:
                              if f.endswith(".so"):
                                  fp = os.path.join(r, f)
                                  with open(fp, "rb") as sfp: data = bytearray(sfp.read())
                                  if len(data) >= 4 and data[:4] == b"\x7fELF":
                                      cls = data[4]
                                      if cls == 2:
                                          phoff = struct.unpack("<Q", data[32:40])[0]
                                          phesz = struct.unpack("<H", data[54:56])[0]
                                          phn = struct.unpack("<H", data[56:58])[0]
                                          for i in range(phn):
                                              ph = phoff + i * phesz
                                              if struct.unpack("<I", data[ph:ph+4])[0] == 1:
                                                  align = struct.unpack("<Q", data[ph+48:ph+56])[0]
                                                  if align < 0x4000:
                                                      struct.pack_into("<Q", data, ph+48, 0x4000)
                                      elif cls == 1:
                                          phoff = struct.unpack("<I", data[28:32])[0]
                                          phesz = struct.unpack("<H", data[42:44])[0]
                                          phn = struct.unpack("<H", data[44:46])[0]
                                          for i in range(phn):
                                              ph = phoff + i * phesz
                                              if struct.unpack("<I", data[ph:ph+4])[0] == 1:
                                                  align = struct.unpack("<I", data[ph+28:ph+32])[0]
                                                  if align < 0x4000:
                                                      struct.pack_into("<I", data, ph+28, 0x4000)
                                      with open(fp, "wb") as sfp: sfp.write(data)
                      for sig in ["MANIFEST.MF", "SAMPKEY.SF", "SAMPKEY.RSA", "CERT.SF", "CERT.RSA"]:
                          sp = os.path.join(tmp_dir, "META-INF", sig)
                          if os.path.exists(sp): os.remove(sp)
                      os.remove(apk_path)
                      with zipfile.ZipFile(apk_path, "w", compression=zipfile.ZIP_DEFLATED) as zout:
                          for r, d, fs in os.walk(tmp_dir):
                              for f in fs:
                                  full = os.path.join(r, f)
                                  rel = os.path.relpath(full, tmp_dir)
                                  zout.write(full, rel)
                      shutil.rmtree(tmp_dir)
                      print(f"Patched 16KB for {file} successfully!")

      # Verify and Sign APK with proper 4-byte zipalign + apksigner
      - name: Verify and Sign APKs
        shell: cmd
        run: |
          for /r release-apks %%f in (*.apk) do (
            echo ==============================================
            echo Processing %%f
            call "%ANDROID_HOME%\build-tools\34.0.0\zipalign.exe" -c -v 4 "%%f"
            if errorlevel 1 (
              echo Re-aligning %%f
              call "%ANDROID_HOME%\build-tools\34.0.0\zipalign.exe" -f -p 4 "%%f" "%%~dpnf-aligned.apk"
              move /y "%%~dpnf-aligned.apk" "%%f"
            )
            echo Signing with full V1 + V2 + V3 scheme:
            call "%ANDROID_HOME%\build-tools\34.0.0\apksigner.bat" sign --ks app-release-key.jks --ks-pass pass:password123456 --ks-key-alias sampkey --key-pass pass:password123456 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false "%%f"
            call "%ANDROID_HOME%\build-tools\34.0.0\aapt2.exe" dump badging "%%f" | findstr "package: sdkVersion: targetSdkVersion: native-code:"
            call "%ANDROID_HOME%\build-tools\34.0.0\apksigner.bat" verify --verbose "%%f"
            echo ==============================================
          )

      # Upload Artifacts
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: release-apks/*.apk

      # Create GitHub Release
      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build v${{ github.run_number }}
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
